server:
  port: 8086
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
axon:
  axonserver:
    servers: 127.0.0.1:8124
  serializer:
    general: jackson
    messages: jackson
    events: jackson
logging:
  level:
    root: INFO
    org.axonframework: INFO
    com.omni.inventory: DEBUG
  charset:
    console: UTF-8
    file: UTF-8