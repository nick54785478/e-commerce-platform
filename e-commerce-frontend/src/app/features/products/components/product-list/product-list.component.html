<div class="page-header animate-fade-in">
  <div>
    <h1 class="page-title">Products</h1>
    <p class="subtitle">Manage your inventory with style.</p>
  </div>
  <button class="btn btn-primary glow-btn" (click)="openCreateModal()">
    <i class="icon-plus">+</i> New Product
  </button>
</div>

<div class="flex flex-wrap gap-4 mb-4 align-items-end animate-fade-in" style="padding: 0 0.5rem;">
  <div class="flex flex-column gap-2 w-full md:w-15rem">
    <label class="text-sm font-semibold text-400">Type</label>
    <p-select [options]="categories" [(ngModel)]="selectedType" optionLabel="label" optionValue="value" [showClear]="true" placeholder="All Types" styleClass="w-full" (onChange)="onCategoryChange()" appendTo="body"></p-select>
  </div>

  <div class="flex flex-column gap-2 w-full md:w-15rem">
    <label class="text-sm font-semibold text-400">Sub Type</label>
    <p-select [options]="types" [(ngModel)]="selectedSubType" optionLabel="label" optionValue="value" [showClear]="true" placeholder="All Sub Types" styleClass="w-full" (onChange)="onFilterChange()" appendTo="body"></p-select>
  </div>
  
  <div class="flex flex-column gap-2 w-full md:w-15rem">
    <label class="text-sm font-semibold text-400">Status</label>
    <p-select [options]="statusOptions" [(ngModel)]="selectedStatus" optionLabel="label" optionValue="value" [showClear]="true" placeholder="All Status" styleClass="w-full" (onChange)="onFilterChange()" appendTo="body"></p-select>
  </div>
</div>

<div class="product-grid" *ngIf="pageView && pageView.content.length > 0; else emptyState">
  <div class="glass-card product-card animate-fade-in" *ngFor="let product of pageView.content; let i = index" [style.animation-delay]="i * 0.05 + 's'">
    <div class="card-image">
      <img [src]="product.imageUrls && product.imageUrls.length > 0 ? product.imageUrls[0] : fallbackImage" 
           alt="Product Image" 
           (error)="handleImageError($event)">
      <div class="status-badge" [class.active]="product.status === 'ACTIVE'" [class.inactive]="product.status === 'INACTIVE'">
        {{ product.status }}
      </div>
    </div>
    <div class="card-content">
      <h3 class="product-name">{{ product.name }}</h3>
      <div class="product-meta">
        <span class="price">${{ product.price | number:'1.2-2' }}</span>
        <span class="stock" [class.low-stock]="product.stock < 10">{{ product.stock }} in stock</span>
      </div>
    </div>
    <div class="card-actions">
      <label class="switch" title="Toggle Status">
        <input type="checkbox" [checked]="product.status === 'ACTIVE'" (change)="toggleStatus(product)">
        <span class="slider round"></span>
      </label>
      <button class="btn btn-secondary btn-sm" (click)="openEditModal(product)">Edit</button>
    </div>
  </div>
</div>

<div class="flex justify-content-center mt-4" *ngIf="pageView && pageView.totalElements > 0">
  <p-paginator [first]="first" [rows]="pageSize" [totalRecords]="pageView.totalElements" (onPageChange)="onPageChange($event)" styleClass="bg-transparent border-none"></p-paginator>
</div>

<ng-template #emptyState>
  <div class="empty-state glass-card animate-fade-in" *ngIf="!loading">
    <div class="empty-icon">📦</div>
    <h3>No products found</h3>
    <p>Get started by creating your first product.</p>
  </div>
</ng-template>

<div class="loading-overlay" *ngIf="loading">
  <div class="spinner"></div>
</div>

<!-- Modal Component -->
<app-product-form-modal 
  *ngIf="showModal" 
  [product]="selectedProduct" 
  (close)="closeModal($event)">
</app-product-form-modal>
