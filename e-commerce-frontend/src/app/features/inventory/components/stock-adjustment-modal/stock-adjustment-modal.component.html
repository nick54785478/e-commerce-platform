<p-dialog header="Adjust Stock" 
          [(visible)]="isVisible" 
          [modal]="true" 
          [closable]="true"
          (onHide)="onCancel()"
          [style]="{ width: '400px' }">
  
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-4 py-4">
    
    <div class="flex flex-column gap-2">
      <div class="mb-4 p-3 surface-ground border-round">
        <div class="text-700">{{ product.name }} (ID: {{ product.productId }})</div>
      </div>
    </div>

    <div class="flex flex-column gap-2">
      <div class="text-500 mb-1">Current Stock</div>
      <div class="text-xl font-bold text-primary">{{ product.stock }}</div>
    </div>

    <div class="flex flex-column gap-2">
      <label class="font-bold">Action</label>
      <div class="flex flex-wrap gap-3">
        <div class="flex align-items-center">
            <p-radioButton name="action" value="ADD" formControlName="action" inputId="actionAdd"></p-radioButton>
            <label for="actionAdd" class="ml-2">Add (增加)</label>
        </div>
        <div class="flex align-items-center">
            <p-radioButton name="action" value="REDUCE" formControlName="action" inputId="actionReduce"></p-radioButton>
            <label for="actionReduce" class="ml-2">Reduce (扣減)</label>
        </div>
      </div>
    </div>

    <div class="flex flex-column gap-2">
      <label for="quantity" class="font-bold">Quantity</label>
      <p-inputNumber inputId="quantity" formControlName="quantity" [min]="1" placeholder="Enter quantity" styleClass="w-full"></p-inputNumber>
    </div>

    <div class="flex justify-content-end gap-2 mt-4">
      <p-button label="Cancel" icon="pi pi-times" severity="secondary" [outlined]="true" (click)="onCancel()"></p-button>
      <p-button label="Confirm" icon="pi pi-check" type="submit" [disabled]="form.invalid || isSubmitting" [loading]="isSubmitting"></p-button>
    </div>
  </form>
</p-dialog>
