<div class="w-full max-w-screen-xl mx-auto">
  <div class="mb-5 animate-fade-in">
    <div>
      <h1 class="text-3xl font-bold text-900 m-0">Inventory Dashboard</h1>
      <p class="text-500 mt-2">Manage product stock levels (Warehouse Staff Only)</p>
    </div>
  </div>

  <div class="surface-card p-4 shadow-1 border-round-xl animate-fade-in" style="animation-delay: 0.1s">
    <div class="flex flex-column md:flex-row justify-content-between md:align-items-center gap-3 mb-4">
      <h3 class="m-0 text-900 font-bold">Stock Overview</h3>
      <div class="flex gap-2">
        <span class="p-input-icon-left w-full sm:w-auto">
          <i class="pi pi-search"></i>
          <input pInputText type="text" [(ngModel)]="searchName" (keyup.enter)="onSearch()" placeholder="Search by name..." class="w-full sm:w-auto" />
        </span>
        <button class="btn btn-primary" (click)="onSearch()">
          <i class="pi pi-search"></i> Search
        </button>
      </div>
    </div>

    <div class="border-1 surface-border border-round-xl overflow-hidden">
      <p-table [value]="pageView?.content || []" [loading]="loading" [rowHover]="true" styleClass="p-datatable-striped">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 20rem">Product Name</th>
            <th>Description</th>
            <th style="width: 10rem" class="text-right">Current Stock</th>
            <th style="width: 10rem" class="text-center">Action</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-product>
          <tr>
            <td class="font-bold text-900">{{ product.name }}</td>
            <td class="text-600">{{ product.description }}</td>
            <td class="text-right text-xl text-primary font-bold">{{ product.stock }}</td>
            <td class="text-center">
              <p-button icon="pi pi-box" label="Adjust" (click)="openAdjustmentModal(product)" styleClass="p-button-sm"></p-button>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="text-center p-5 text-500">No products found.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>

  <p-paginator 
    [rows]="pageSize" 
    [totalRecords]="pageView?.totalElements || 0" 
    [first]="first"
    (onPageChange)="onPageChange($event)">
  </p-paginator>

  </div>
</div>

<app-stock-adjustment-modal *ngIf="showModal && selectedProduct" [product]="selectedProduct" (close)="closeModal($event)"></app-stock-adjustment-modal>
