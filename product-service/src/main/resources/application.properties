server.port=8083

spring.application.name=product-service

#### Encoding & Logging ####
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
logging.charset.console=UTF-8
logging.charset.file=UTF-8

#### PostgreSQL ####
spring.datasource.url=jdbc:postgresql://localhost:5432/product_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

#### Spring Data JPA ####
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#### Axon ####
axon.eventhandling.processors.product-group.mode=tracking
axon.eventhandling.processors.product-group.initial-segment-count=1
axon.axonserver.servers=127.0.0.1:8124
axon.axonserver.context=default
axon.axonserver.component-name=product-service

# 強制 Axon 使用 jackson 處理所有序列化
axon.serializer.general=jackson
axon.serializer.messages=jackson
axon.serializer.events=jackson

# MinIO Configuration
minio.url=http://localhost:9000
minio.access.key=minioadmin
minio.secret.key=minioadmin
minio.bucket.name=products

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Behavior Tracking Service
omni.behavior-service.url=http://localhost:8084
